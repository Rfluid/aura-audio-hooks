blank_issues_enabled: false
contact_links:
  - name: Usage question / how-do-I
    url: https://github.com/Rfluid/aura-audio-hooks#readme
    about: For "how do I install / configure / use Audio Hooks?" please check the README first; it covers install, the panel tabs, the CLI, and the config format. Deeper references live in docs/ (architecture, cli, panel, configuration).
  - name: Bug in aura itself
    url: https://github.com/Rfluid/aura/issues
    about: If the problem is in the aura host (tray, modal, plugin loading) rather than this plugin's behavior, please file it on the aura repository instead.
  - name: Security disclosure
    url: https://github.com/Rfluid/aura-audio-hooks/security/advisories/new
    about: Please do not file security-sensitive reports as public issues. Use a private security advisory instead.
