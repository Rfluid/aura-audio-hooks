name: Release Binaries

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.label }}
        runs-on: ${{ matrix.runner }}
        continue-on-error: ${{ matrix.experimental }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: linux-x86_64-gnu
                      runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      experimental: false
                    - label: linux-aarch64-gnu
                      runner: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      experimental: true
                    - label: macos-x86_64
                      runner: macos-15-intel
                      target: x86_64-apple-darwin
                      experimental: false
                    - label: macos-aarch64
                      runner: macos-15
                      target: aarch64-apple-darwin
                      experimental: false
                    - label: windows-x86_64
                      runner: windows-latest
                      target: x86_64-pc-windows-msvc
                      experimental: false
                    - label: windows-aarch64
                      runner: windows-latest
                      target: aarch64-pc-windows-msvc
                      experimental: true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.120.0
              with:
                  targets: ${{ matrix.target }}

            # Pure-Rust crate: cross-building to aarch64 only needs the GNU
            # cross linker — no foreign-arch dev packages or pkg-config setup.
            - name: Install aarch64 cross-compile toolchain
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: |
                  set -euxo pipefail
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --locked --target "${{ matrix.target }}"

            - name: Package release artifacts (Unix)
              if: ${{ !startsWith(matrix.runner, 'windows') }}
              shell: bash
              env:
                  TAG: ${{ github.ref_name }}
                  TARGET_TRIPLE: ${{ matrix.target }}
              run: |
                  set -euo pipefail
                  ASSET_DIR="aura-plugin-audio-hooks-${TAG}-${TARGET_TRIPLE}"

                  mkdir -p "dist/${ASSET_DIR}"
                  cp "target/${TARGET_TRIPLE}/release/aura-plugin-audio-hooks" \
                      "dist/${ASSET_DIR}/aura-plugin-audio-hooks"
                  chmod 755 "dist/${ASSET_DIR}/aura-plugin-audio-hooks"

                  # Plugin icon ships alongside the binary so `aura plugin add
                  # --icon` can reference it without this checkout.
                  cp assets/icon.svg "dist/${ASSET_DIR}/aura-plugin-audio-hooks.svg"
                  chmod 644 "dist/${ASSET_DIR}/aura-plugin-audio-hooks.svg"

                  # README and LICENSE for context inside the archive.
                  for f in README.md LICENSE; do
                      [ -f "$f" ] && cp "$f" "dist/${ASSET_DIR}/$f"
                  done

                  tar -C dist -czf "dist/${ASSET_DIR}.tar.gz" "${ASSET_DIR}"
                  (
                      cd dist
                      if command -v sha256sum >/dev/null 2>&1; then
                          sha256sum "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.sha256"
                      else
                          shasum -a 256 "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.sha256"
                      fi
                  )

            - name: Package release artifacts (Windows)
              if: startsWith(matrix.runner, 'windows')
              shell: pwsh
              env:
                  TAG: ${{ github.ref_name }}
                  TARGET_TRIPLE: ${{ matrix.target }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $assetDir = "aura-plugin-audio-hooks-$env:TAG-$env:TARGET_TRIPLE"
                  $stageRoot = "dist/$assetDir"
                  New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null

                  Copy-Item "target/$env:TARGET_TRIPLE/release/aura-plugin-audio-hooks.exe" `
                      "$stageRoot/aura-plugin-audio-hooks.exe"
                  Copy-Item "assets/icon.svg" "$stageRoot/aura-plugin-audio-hooks.svg"

                  foreach ($f in @('README.md', 'LICENSE')) {
                      if (Test-Path $f) { Copy-Item $f "$stageRoot/$f" }
                  }

                  $zip = "dist/$assetDir.zip"
                  if (Test-Path $zip) { Remove-Item $zip }
                  Compress-Archive -Path "$stageRoot/*" -DestinationPath $zip

                  $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
                  "$hash  $assetDir.zip" | Out-File -Encoding ascii "dist/$assetDir.sha256"

            - name: Upload packaged artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.target }}
                  path: |
                      dist/*.tar.gz
                      dist/*.zip
                      dist/*.sha256
                  if-no-files-found: error

    publish:
        name: Publish GitHub release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download packaged artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: |
                      dist/*.tar.gz
                      dist/*.zip
                      dist/*.sha256
