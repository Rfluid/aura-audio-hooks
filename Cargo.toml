[package]
name        = "aura-plugin-audio-hooks"
version     = "0.2.0"
edition     = "2021"
license     = "MIT"
publish     = false
description = "Aura plugin that manages per-agent audio hook profiles"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

[profile.release]
strip = true
lto   = true
